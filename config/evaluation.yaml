# Auto-Mobility Evaluation & Quality Configuration

evaluation:
  # Trajectory & Frame timestamp association
  max_pose_gap_ms: 50.0        # Max allowed timestamp difference (ms) for pose matching
  association_fallback: "nearest"  # "slerp_interp" (preferred) or "nearest"
  enable_interpolation: true

  # Train / Hold-out Frame Split
  holdout:
    policy: "every_nth"        # "every_nth" or "ratio"
    nth: 5                     # Every 5th frame -> 20% holdout
    ratio: 0.20                # Used if policy is "ratio"
    min_train_frames: 10
    min_holdout_frames: 5

  # Depth Raycasting & Reprojection (Unified with Reconstruction depth domain 0.3m ~ 3.0m)
  raycasting:
    depth_min_m: 0.3
    depth_max_m: 3.0
    depth_scale: 1000.0        # 16UC1 mm to meters
    render_samples: 10         # Number of representative holdout frames to render visualization

  # Point-to-Mesh Distance
  point_to_mesh:
    max_sample_points: 50000   # Downsample holdout point cloud for fast distance computation
    max_distance_mm: 500.0     # Cap distance to ignore extreme outliers

  # Dominant Plane Analysis
  plane_analysis:
    enabled: true
    distance_threshold_m: 0.02 # 2cm RANSAC distance threshold
    ransac_n: 3
    num_iterations: 1000
    max_planes: 5

  # Adaptive Search Triggers & Thresholds
  adaptive_search:
    fine_voxel_trigger:
      min_quality_gain: 1.0     # Min quality improvement from 10mm -> 8mm required to trigger 5mm
      max_estimated_memory_gb: 12.0
      allow_if_8mm_failed: false
    evaluation:
      stage1_holdout_samples: 12
      stage2_expanded_samples: 30
      close_candidate_delta_threshold: 2.0  # Quality score diff <= 2.0 triggers Stage 2

  # Ranking weights & tie break parameters (Single Source of Truth)
  ranking:
    geometry_accuracy_weight: 0.40
    coverage_weight: 0.25
    artifact_weight: 0.20
    topology_weight: 0.15
    performance_weight: 0.10
    quality_tie_epsilon: 0.5
    cost_tiebreak_enabled: true

# Quality Thresholds for PASS / WARN / FAIL (Data-driven heuristic defaults)
quality_thresholds:
  dataset:
    rgb_hz:
      pass: 20.0
      warn: 10.0
    depth_hz:
      pass: 20.0
      warn: 10.0
    sync_delta_p95_ms:
      pass: 25.0
      warn: 50.0
    monotonic_violations:
      pass: 0
      warn: 0
  pose_association:
    coverage_ratio:
      pass: 0.85
      warn: 0.65
    pose_dt_p95_ms:
      pass: 35.0
      warn: 50.0
  geometry:
    depth_mae_mm:
      pass: 25.0
      warn: 50.0
    depth_p95_mm:
      pass: 60.0
      warn: 120.0
    depth_coverage_ratio:
      pass: 0.75
      warn: 0.50
    within_20mm_ratio:
      pass: 0.65
      warn: 0.40
    point_to_mesh_p95_mm:
      pass: 50.0
      warn: 100.0
  mesh_topology:
    degenerate_ratio:
      pass: 0.001
      warn: 0.01
    non_manifold_ratio:
      pass: 0.001
      warn: 0.01
    small_component_area_ratio:
      pass: 0.05
      warn: 0.15

# Quality Composite Score Weights for Ranking Candidates
quality_weights:
  geometry_accuracy: 0.40      # Depth MAE, Depth P95, Point-to-Mesh P95
  geometry_coverage: 0.25      # Depth coverage ratio, within 20mm ratio
  artifact_penalty: 0.20       # Free space correctness, small component ratio
  topology: 0.15               # Degenerate triangles, dominant plane consistency
  performance: 0.10            # Runtime, Memory
