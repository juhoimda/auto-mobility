# ROS2 Topics configuration for RealSense D435i & Visual SLAM
# 토픽명 단일 소스. 수정 시 config.py / common.sh / launch 파일에 동일하게 반영된다.
camera:
  rgb_topic: "/camera/camera/color/image_raw"
  rgb_compressed_topic: "/camera/camera/color/image_raw/compressed"
  depth_topic: "/camera/camera/depth/image_rect_raw"
  depth_compressed_topic: "/camera/camera/depth/image_rect_raw/compressedDepth"
  aligned_depth_topic: "/camera/camera/aligned_depth_to_color/image_raw"
  aligned_depth_compressed_topic: "/camera/camera/aligned_depth_to_color/image_raw/compressedDepth"
  camera_info_topic: "/camera/camera/color/camera_info"
  # Windows 네이티브 realsense_pub.py 가 직접 발행하는 원본 CameraInfo (republish.py가 구독)
  camera_info_windows_topic: "/camera/camera/color/camera_info_windows"
  imu_topic: "/camera/camera/imu"
  imu_filtered_topic: "/camera/camera/imu/filtered"

rtabmap:
  frame_id: "camera_link"
  odom_frame_id: "odom"
  map_frame_id: "map"
  odom_topic: "/rtabmap/odom"
  map_topic: "/rtabmap/mapData"
  cloud_map_topic: "/rtabmap/cloud_map"
  cloud_map_lite_topic: "/rtabmap/cloud_map_lite"
